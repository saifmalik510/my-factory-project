<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 84" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="navGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7E5B5"/>
      <stop offset="40%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#AA822A"/>
      <stop offset="100%" stop-color="#805F19"/>
    </linearGradient>

    <linearGradient id="navFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#E2C267"/>
      <stop offset="100%" stop-color="#9E7620"/>
    </linearGradient>
  </defs>

  <!-- Left Minimalist Emblem -->
  <g transform="translate(6, 4) scale(0.88)">
    <polygon points="42,4 78,19 84,56 60,80 24,80 0,56 6,19" 
             stroke="url(#navGold)" stroke-width="1.8" fill="none" opacity="0.85"/>

    <!-- Minimalist Slabs of 'A' -->
    <polygon points="42,14 26,62 34,62 42,36" fill="url(#navFacet)"/>
    <polygon points="42,14 18,68 26,68 42,26" fill="url(#navGold)"/>
    <polygon points="42,14 58,62 50,62 42,36" fill="url(#navGold)"/>
    <polygon points="42,14 66,68 58,68 42,26" fill="url(#navFacet)"/>
    <polygon points="28,52 56,52 52,57 32,57" fill="url(#navGold)"/>
    <polygon points="42,10 46,16 42,22 38,16" fill="url(#navFacet)"/>
  </g>

  <!-- Fine Vertical Separator Line -->
  <line x1="96" y1="16" x2="96" y2="68" stroke="url(#navGold)" stroke-width="1" opacity="0.35"/>

  <!-- Right Clean Typography -->
  <text x="112" y="38" 
        font-family="'Cormorant Garamond', 'Cinzel', serif" 
        font-size="28" 
        font-weight="700" 
        letter-spacing="3.5" 
        fill="url(#navGold)">
    ABDULLAH
  </text>

  <text x="113" y="57" 
        font-family="'Inter', -apple-system, sans-serif" 
        font-size="9.5" 
        font-weight="700" 
        letter-spacing="4.5" 
        fill="#232220">
    MARBLE FACTORY
  </text>

  <text x="113" y="71" 
        font-family="'Inter', sans-serif" 
        font-size="8" 
        font-weight="600" 
        letter-spacing="2" 
        fill="#C5A059">
    FORT ABBAS • EST. 2012
  </text>
</svg>
